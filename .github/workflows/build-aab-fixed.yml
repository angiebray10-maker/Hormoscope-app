name: Build Android AAB
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/hormoscope.keystore
      - name: Build AAB
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease -Pandroid.injected.signing.store.file=/tmp/hormoscope.keystore -Pandroid.injected.signing.store.password=" {{ secrets.KEYSTORE_PASSWORD }}" -Pandroid.injected.signing.key.alias=" {{ secrets.KEY_ALIAS }}" -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: hormoscope-release
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
