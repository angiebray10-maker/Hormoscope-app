name: Build Android AAB
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/hormoscope.keystore
          ls -lh /tmp/hormoscope.keystore
          # Verify keystore is valid (list entries without password)
          keytool -list -keystore /tmp/hormoscope.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" 2>&1 | head -10
      - name: Build AAB
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace 2>&1 | tail -100
      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hormoscope-release
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
